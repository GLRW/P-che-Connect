<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pêcheur · publier</title>
<style>body{padding:0!important;background:#fff!important;display:block!important}[data-go]{cursor:pointer}a[href]{cursor:pointer}</style></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap">
<style>
body{margin:0;background:#ebebe8;display:flex;justify-content:center;padding:24px 0}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; color: #111111; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 10px"><span aria-label="Pêche Connect" style="width: 40px; height: 40px; border-radius: 10px; background: #0057d9; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font: 400 21px 'Bebas Neue', sans-serif; letter-spacing: 1px; padding-top: 3px; box-sizing: border-box">PC</span>
        <span style="font-size: 15px; color: #62625d">Bonjou Jean-Marc</span>
      </div>
      <a href="#" style="font: 800 13px Figtree; color: #111111; background: #f3f3f1; text-decoration: none; padding: 8px 12px; border-radius: 999px">3 bons à préparer</a>
    </div>
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1">Votre arrivage du jour</h1>
    <span style="font-size: 14px; color: #62625d">Le Robert · ponton du front de mer · retrait jusqu'à <strong style="color: #111111; white-space: nowrap">12 h 30</strong></span>
  </header>

  <main style="flex-grow: 1; padding: 4px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="min-height: 72px; border: 0; border-radius: 14px; background: #f3f3f1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 14px Figtree; color: #111111">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Photo de la pêche</button>
      <button style="min-height: 72px; border: 0; border-radius: 14px; background: #f3f3f1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 14px Figtree; color: #111111">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        Dicter l'arrivage</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #e5e5e2">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <strong style="font-size: 16px">Thon jaune</strong>
          <button style="align-self: flex-start; border: 1px solid #e5e5e2; background: #ffffff; border-radius: 8px; padding: 4px 8px; font: 800 14px Figtree; color: #111111; font-variant-numeric: tabular-nums">14,00 €/kg <span style="font-weight: 600; color: #62625d">· modifier</span></button>
        </div>
        <div style="display: flex; align-items: center; background: #f3f3f1; border-radius: 999px; padding: 4px">
          <button aria-label="Moins de thon jaune" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #ffffff; font: 800 20px Figtree; color: #111111">−</button>
          <span style="width: 56px; text-align: center; font: 800 16px Figtree; font-variant-numeric: tabular-nums">30 kg</span>
          <button aria-label="Plus de thon jaune" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #111111; font: 800 20px Figtree; color: #ffffff">+</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #e5e5e2">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <strong style="font-size: 16px">Dorade coryphène</strong>
          <button style="align-self: flex-start; border: 1px solid #e5e5e2; background: #ffffff; border-radius: 8px; padding: 4px 8px; font: 800 14px Figtree; color: #111111; font-variant-numeric: tabular-nums">13,00 €/kg <span style="font-weight: 600; color: #62625d">· modifier</span></button>
        </div>
        <div style="display: flex; align-items: center; background: #f3f3f1; border-radius: 999px; padding: 4px">
          <button aria-label="Moins de dorade coryphène" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #ffffff; font: 800 20px Figtree; color: #111111">−</button>
          <span style="width: 56px; text-align: center; font: 800 16px Figtree; font-variant-numeric: tabular-nums">18 kg</span>
          <button aria-label="Plus de dorade coryphène" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #111111; font: 800 20px Figtree; color: #ffffff">+</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #e5e5e2">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px">
          <strong style="font-size: 16px">Balaou</strong>
          <button style="align-self: flex-start; border: 1px solid #e5e5e2; background: #ffffff; border-radius: 8px; padding: 4px 8px; font: 800 14px Figtree; color: #111111; font-variant-numeric: tabular-nums">10,00 €/kg <span style="font-weight: 600; color: #62625d">· modifier</span></button>
        </div>
        <div style="display: flex; align-items: center; background: #f3f3f1; border-radius: 999px; padding: 4px">
          <button aria-label="Moins de balaou" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #ffffff; font: 800 20px Figtree; color: #111111">−</button>
          <span style="width: 56px; text-align: center; font: 800 16px Figtree; font-variant-numeric: tabular-nums">8 kg</span>
          <button aria-label="Plus de balaou" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #111111; font: 800 20px Figtree; color: #ffffff">+</button>
        </div>
      </div>
    </div>

    <button style="align-self: flex-start; border: 0; background: transparent; padding: 8px 0; min-height: 44px; font: 800 15px Figtree; color: #111111">+ Ajouter une espèce</button>
    <div style="display: flex; gap: 10px; align-items: center; background: #f3f3f1; border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #62625d">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#62625d" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
      Vos prix et quantités d'hier sont déjà remplis.</div>
  </main>

  <div style="padding: 12px 16px 16px; border-top: 1px solid #e5e5e2">
    <a href="#" style="display: flex; justify-content: space-between; align-items: center; background: #111111; color: #ffffff; text-decoration: none; font: 800 17px Figtree; padding: 0 20px; height: 56px; border-radius: 14px">
      <span>Mettre en vente</span><span style="font-weight: 600; color: #c9c9c4">56 kg · 3 espèces</span></a>
  </div>
</div>
<script>
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-go]');
  if (!el) return;
  e.preventDefault();
  location.href = el.getAttribute('data-go');
});
</script></body>
</html>
