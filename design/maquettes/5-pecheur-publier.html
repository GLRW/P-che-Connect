<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pêcheur : publier un arrivage</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat+Brush&display=swap">
<style>
body{margin:0;background:#e6ebec;display:flex;justify-content:center;padding:24px 0}
a{color:#0e2a3b}a:hover{color:#0e2a3b}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #e6d8bc; color: #0e2a3b; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Caveat Brush', cursive; font-size: 26px; line-height: 1">Bonjou Jean-Marc !</span>
      <a href="#" style="font: 800 13px 'Bricolage Grotesque', sans-serif; color: #ffffff; background: #1e6e78; text-decoration: none; padding: 8px 10px">3 bons à préparer</a>
    </div>
    <h1 style="margin: 0; font-family: Bungee, sans-serif; font-weight: 400; font-size: 30px; line-height: 1">QU'EST-CE QUI<br>EST RENTRÉ ?</h1>
    <span style="font-size: 15px">Le Robert · ponton du front de mer · retrait jusqu'à <strong>12 h 30</strong></span>
  </header>

  <main style="flex-grow: 1; background: #ffffff; border-top: 3px solid #0e2a3b; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="min-height: 76px; border: 3px solid #0e2a3b; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 14px 'Bricolage Grotesque', sans-serif; color: #0e2a3b">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e2a3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Photo de la pêche</button>
      <button style="min-height: 76px; border: 3px solid #0e2a3b; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 800 14px 'Bricolage Grotesque', sans-serif; color: #0e2a3b">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e2a3b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        Dicter l'arrivage</button>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 2px solid #0e2a3b">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #0e2a3b; gap: 8px">
        <strong style="font-size: 17px; flex-grow: 1">Thon jaune</strong>
        <div style="display: flex; align-items: center; gap: 6px">
          <button aria-label="Moins de thon" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">−</button>
          <span style="font: 400 18px Bungee, sans-serif; width: 58px; text-align: center">30 kg</span>
          <button aria-label="Plus de thon" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">+</button>
        </div>
        <span style="background: #e6d8bc; font: 400 15px Bungee, sans-serif; padding: 6px 6px 4px; border: 2px solid #0e2a3b">14 €</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #0e2a3b; gap: 8px">
        <strong style="font-size: 17px; flex-grow: 1">Dorade</strong>
        <div style="display: flex; align-items: center; gap: 6px">
          <button aria-label="Moins de dorade" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">−</button>
          <span style="font: 400 18px Bungee, sans-serif; width: 58px; text-align: center">18 kg</span>
          <button aria-label="Plus de dorade" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">+</button>
        </div>
        <span style="background: #e6d8bc; font: 400 15px Bungee, sans-serif; padding: 6px 6px 4px; border: 2px solid #0e2a3b">13 €</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 2px solid #0e2a3b; gap: 8px">
        <strong style="font-size: 17px; flex-grow: 1">Balaou</strong>
        <div style="display: flex; align-items: center; gap: 6px">
          <button aria-label="Moins de balaou" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">−</button>
          <span style="font: 400 18px Bungee, sans-serif; width: 58px; text-align: center">8 kg</span>
          <button aria-label="Plus de balaou" style="width: 44px; height: 44px; border: 2px solid #0e2a3b; background: #ffffff; font: 400 20px Bungee, sans-serif; color: #0e2a3b">+</button>
        </div>
        <span style="background: #e6d8bc; font: 400 15px Bungee, sans-serif; padding: 6px 6px 4px; border: 2px solid #0e2a3b">10 €</span>
      </div>
    </div>

    <button style="align-self: flex-start; border: 0; background: transparent; padding: 8px 0; min-height: 44px; font: 800 15px 'Bricolage Grotesque', sans-serif; color: #0e2a3b; text-decoration: underline">+ Ajouter une espèce</button>
    <span style="font-family: 'Caveat Brush', cursive; font-size: 20px; color: #0e2a3b; line-height: 1.1">Tes prix et tes quantités d'hier sont déjà remplis.</span>
  </main>

  <div style="padding: 12px 16px 16px; background: #ffffff; border-top: 3px solid #0e2a3b">
    <a href="#" style="display: block; text-align: center; background: #1e6e78; color: #ffffff; text-decoration: none; font-family: Bungee, sans-serif; font-size: 20px; padding: 16px 0 14px; box-shadow: 4px 4px 0 #0e2a3b">METTRE EN VENTE</a>
  </div>
</div>


</body>
</html>
